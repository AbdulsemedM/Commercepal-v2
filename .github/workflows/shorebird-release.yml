name: Shorebird Release

# Builds store-ready artifacts with Shorebird so they can receive later patches.
# Requires repository secret: SHOREBIRD_TOKEN
# Android signing secrets (optional but needed for signed release):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms (android,ios)'
        required: false
        default: 'android,ios'

jobs:
  release-android:
    if: >-
      github.event_name == 'push' ||
      contains(github.event.inputs.platforms, 'android')
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced in if:; map them to env first
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird doctor
        run: shorebird doctor

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/keystore.properties

      - name: Shorebird release Android
        # Pin to the project's Flutter stable (see .metadata); avoid "latest" SDK skew.
        run: shorebird release android --flutter-version=3.35.7

  release-ios:
    if: >-
      github.event_name == 'push' ||
      contains(github.event.inputs.platforms, 'ios')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird doctor
        run: shorebird doctor

      - name: Shorebird release iOS
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "iOS release requires Apple signing configured on this runner."
          echo "See docs/ota-updates.md"
          shorebird release ios --flutter-version=3.35.7
