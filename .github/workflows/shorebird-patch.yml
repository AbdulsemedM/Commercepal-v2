name: Shorebird Patch

on:
  push:
    branches:
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Existing Shorebird release version (e.g. 6.0.3+153). Must already be live.'
        required: true
        type: string
      platforms:
        description: 'Comma-separated platforms (android,ios)'
        required: false
        default: 'android,ios'
      track:
        description: 'Shorebird patch track (beta recommended before stable)'
        required: false
        default: 'beta'

jobs:
  patch-android:
    if: contains(github.event.inputs.platforms || 'android,ios', 'android')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require release_version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_version == ''
        run: |
          echo "release_version is required for patch jobs."
          exit 1

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            # hotfix branch convention: hotfix/6.0.3+153 or hotfix/6.0.3
            BRANCH="${GITHUB_REF_NAME}"
            VER="${BRANCH#hotfix/}"
            echo "value=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird doctor
        run: shorebird doctor

      - name: Shorebird patch Android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          TRACK="${{ github.event.inputs.track || 'beta' }}"
          echo "Patching Android release ${{ steps.version.outputs.value }} on track ${TRACK}"
          echo "The base Shorebird release must already exist; this step fails if it does not."
          shorebird patch android \
            --release-version "${{ steps.version.outputs.value }}" \
            --track "${TRACK}" \
            --flutter-version=3.35.7

  patch-ios:
    if: contains(github.event.inputs.platforms || 'android,ios', 'ios')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF_NAME}"
            VER="${BRANCH#hotfix/}"
            echo "value=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird doctor
        run: shorebird doctor

      - name: Shorebird patch iOS
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          TRACK="${{ github.event.inputs.track || 'beta' }}"
          echo "Patching iOS release ${{ steps.version.outputs.value }} on track ${TRACK}"
          echo "The base Shorebird release must already exist; this step fails if it does not."
          shorebird patch ios \
            --release-version "${{ steps.version.outputs.value }}" \
            --track "${TRACK}" \
            --flutter-version=3.35.7
